# Protótipo Android do 5K Video Downloader: compila os APKs de teste (debug) da pasta android/ do
# repositório do código e testa num emulador. Não publica nada: os APKs ficam por 7 dias em
# "Artifacts", na página da execução.
#
#   gh workflow run android.yml -R 5k-video-downloader/downloads -f versao=main

name: Android (protótipo)
run-name: Android ${{ inputs.versao }}

on:
  workflow_dispatch:
    inputs:
      versao:
        description: Branch ou tag do código
        required: true
        default: main

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: igorcnet/5K-Video-Downloader
          ref: ${{ inputs.versao }}
          token: ${{ secrets.CODIGO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (o Chaquopy usa para instalar os pacotes do app)
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.14.6'

      - name: Chave fixa de assinatura (se houver, os APKs de teste instalam por cima uns dos outros)
        env:
          CHAVE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$CHAVE" ]; then
            printf '%s' "$CHAVE" | base64 -d > "$RUNNER_TEMP/android-5k.p12"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/android-5k.p12" >> "$GITHUB_ENV"
          fi

      - name: Compilar os APKs (debug)
        env:
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          gradle -p android assembleDebug --no-daemon
          mkdir -p apks
          for par in arm64:arm64-v8a x86_64:x86_64; do
            cp "android/app/build/outputs/apk/${par%%:*}/debug/app-${par%%:*}-debug.apk" \
              "apks/5K-Video-Downloader-Android-${par#*:}.apk"
          done
          ls -l apks

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks-android
          path: apks/
          if-no-files-found: error
          retention-days: 7

      - name: Ligar a aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testar no emulador (Android 14)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/testar-no-emulador.sh apks

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: telas-emulador
          path: tela-*.png
          if-no-files-found: ignore
          retention-days: 7
