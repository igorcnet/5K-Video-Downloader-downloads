# Gera os instaladores do 5K Video Downloader e publica as Releases deste repositório.
#
# Roda aqui, no repositório público, porque o GitHub Actions é gratuito em repositórios públicos
# (no privado, cada minuto de Mac conta 10 vezes e o limite do mês acaba rápido). O código continua
# no repositório privado igorcnet/5K-Video-Downloader: o workflow só o baixa durante o build, com o
# secret CODIGO_TOKEN (token fine-grained com "Contents: Read-only" só no repositório do código).
#
# Normalmente quem dispara é o ./lancar-versao.sh do repositório do código, que cria a tag e chama:
#   gh workflow run instaladores.yml -R igorcnet/5K-Video-Downloader-downloads -f versao=v2.1
# Ele compila no Windows, no macOS e no Linux, testa e publica a Release com nomes fixos (links estáveis):
#   .../releases/latest/download/5K-Video-Downloader-Windows.exe
#   .../releases/latest/download/5K-Video-Downloader-macOS.dmg         (Mac M1 em diante)
#   .../releases/latest/download/5K-Video-Downloader-macOS-Intel.dmg
#   .../releases/latest/download/5K-Video-Downloader-Linux.deb          (Ubuntu, Mint, Debian)
#   .../releases/latest/download/5K-Video-Downloader-Android.apk        (Android 7+, 64 bits)
# Com publicar=false só compila e testa; os arquivos ficam por 2 dias em "Artifacts", na página da execução.
#
# Assinatura: depois que este workflow publica, o ./lancar-versao.sh assina a Release no computador de quem
# lança e sobe o manifesto.json + manifesto.json.sig (versão e SHA-256 de cada instalador, assinados com
# Ed25519). A chave privada NUNCA fica no GitHub; o programa instalado só aceita atualizações assinadas.
# As actions estão fixadas pelo SHA do commit (a versão fica no comentário): para atualizar uma, troque o SHA
# pelo da versão nova (gh api repos/<dono>/<action>/commits/<tag> --jq .sha).

name: Instaladores
run-name: Instaladores ${{ inputs.versao }}${{ !inputs.publicar && ' (só teste)' || '' }}

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Tag do código a compilar (ex.: v2.1), ou main para só testar'
        required: true
        default: main
      publicar:
        description: Publicar a Release (só para tags v*)
        type: boolean
        default: true

permissions:
  contents: read

env:
  CODIGO: igorcnet/5K-Video-Downloader

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CODIGO }}
          ref: ${{ inputs.versao }}
          token: ${{ secrets.CODIGO_TOKEN }}
          persist-credentials: false
      - name: Versão da tag igual à do programa
        if: startsWith(inputs.versao, 'v')
        env:
          TAG: ${{ inputs.versao }}
        # O aviso de atualização do programa compara a tag do Release com o APP_VERSION do motor.py
        # (mesma conta do atualizacao.py): se forem diferentes, ele pediria para atualizar para sempre.
        run: |
          python3 - "$TAG" <<'FIM'
          import re, sys
          def versao(texto):
              numeros = [int(n) for n in re.findall(r'\d+', texto)[:3]]
              return tuple(numeros + [0] * (3 - len(numeros)))
          tag = sys.argv[1]
          programa = re.search(r"^APP_VERSION = '([^']+)'", open('motor.py', encoding='utf-8').read(), re.M)[1]
          if versao(tag) != versao(programa):
              print(f"::error::A tag {tag} não bate com APP_VERSION = '{programa}' no motor.py. "
                    f"Mude o APP_VERSION, faça commit e crie a tag igual (ex.: v{programa}).")
              sys.exit(1)
          print(f'Tag {tag} = programa {programa}')
          FIM

  windows:
    needs: conferir
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CODIGO }}
          ref: ${{ inputs.versao }}
          token: ${{ secrets.CODIGO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compilar (PyInstaller, com o bootloader compilado aqui)
        env:
          # O bootloader pronto do PyInstaller é idêntico em milhares de programas e o Windows Defender o confunde
          # com vírus (detecção "!ml"); compilado aqui com o MSVC do runner, o executável fica só nosso.
          PYINSTALLER_COMPILE_BOOTLOADER: '1'
        run: python empacotar.py

      - name: Instalador (Inno Setup)
        shell: pwsh
        env:
          VERSAO: ${{ inputs.versao }}
        run: |
          $versao = if ($env:VERSAO -like 'v*') { $env:VERSAO -replace '^v', '' } else { 'teste' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DVersao=$versao" instalador\windows.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Item dist\5K-Video-Downloader-Windows.exe | Format-Table Name, Length

      - name: Testar (instala e abre o programa)
        shell: pwsh
        run: |
          Start-Process dist\5K-Video-Downloader-Windows.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $pasta = "$env:LOCALAPPDATA\Programs\5K Video Downloader"
          if (-not (Test-Path "$pasta\5K Video Downloader.exe")) { $pasta = "$env:ProgramFiles\5K Video Downloader" }
          & "$pasta\_internal\bin\deno.exe" --version
          $ffmpeg = Get-ChildItem "$pasta\_internal\imageio_ffmpeg\binaries" -Filter 'ffmpeg*.exe' | Select-Object -First 1
          & $ffmpeg.FullName -hide_banner -version | Select-Object -First 1
          Get-Content "$pasta\_internal\licencas\LEIA-ME.txt" -TotalCount 8
          $app = Start-Process "$pasta\5K Video Downloader.exe" -PassThru
          Start-Sleep 30
          $app.Refresh()
          $log = "$env:APPDATA\5K Video Downloader\registro.log"
          if (Test-Path $log) { Get-Content $log }
          "Janela: '$($app.MainWindowTitle)'"
          if ($app.HasExited) {
            "Código de saída: $($app.ExitCode)"
            $wv2 = 'SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            "WebView2: HKLM=$((Get-ItemProperty "HKLM:\$wv2" -ErrorAction SilentlyContinue).pv) HKCU=$((Get-ItemProperty "HKCU:\$($wv2 -replace 'WOW6432Node\\', '')" -ErrorAction SilentlyContinue).pv)"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddMinutes(-3) } -ErrorAction SilentlyContinue |
              Select-Object -First 5 | Format-List TimeCreated, ProviderName, Message
            throw 'O programa fechou sozinho'
          }
          if (-not (Select-String -Path $log -Pattern 'aberto .*JavaScript: deno' -Quiet)) { throw 'O programa não abriu direito' }
          if (Select-String -Path $log -Pattern 'Traceback|erro interno' -Quiet) { throw 'Erro no registro' }
          Stop-Process -Id $app.Id -Force

      - name: Windows Defender (o instalador e o programa instalado não podem ser acusados)
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { 'Windows Defender não está neste runner'; exit 0 }
          & $mp -SignatureUpdate | Select-Object -Last 2
          Get-MpComputerStatus -ErrorAction SilentlyContinue | Format-List AntivirusSignatureVersion, AntivirusSignatureLastUpdated
          $pasta = "$env:LOCALAPPDATA\Programs\5K Video Downloader"
          foreach ($alvo in @((Resolve-Path dist\5K-Video-Downloader-Windows.exe).Path, $pasta)) {
            & $mp -Scan -ScanType 3 -File $alvo -DisableRemediation | Select-Object -Last 4
            if ($LASTEXITCODE -eq 2) { throw "O Windows Defender acusou: $alvo" }
            "OK ($LASTEXITCODE): $alvo"
          }

      - name: Diagnóstico (roda pelo código, com as mensagens na tela)
        if: failure()
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList 'app.py' -RedirectStandardOutput saida.txt -RedirectStandardError erros.txt -PassThru
          Start-Sleep 30
          $p.Refresh()
          "Encerrado: $($p.HasExited)  Código: $(if ($p.HasExited) { $p.ExitCode })"
          Get-Content saida.txt, erros.txt -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 5K-Video-Downloader-Windows.exe
          path: dist/5K-Video-Downloader-Windows.exe
          if-no-files-found: error
          retention-days: 2

  macos:
    needs: conferir
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest          # Apple Silicon (M1 em diante)
            arquivo: 5K-Video-Downloader-macOS.dmg
          - runner: macos-15-intel        # Intel (a GitHub mantém este runner até o fim de 2027)
            arquivo: 5K-Video-Downloader-macOS-Intel.dmg
    runs-on: ${{ matrix.runner }}
    env:
      APP: dist/5K Video Downloader.app
      DMG: dist/${{ matrix.arquivo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CODIGO }}
          ref: ${{ inputs.versao }}
          token: ${{ secrets.CODIGO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compilar (PyInstaller)
        run: python empacotar.py

      - name: Assinatura ad-hoc e .dmg
        run: |
          uname -m
          codesign --verify --deep --strict "$APP" || codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "macOS mínimo exigido pelos binários do pacote:"
          find "$APP/Contents" -type f \( -perm -u+x -o -name '*.so' -o -name '*.dylib' \) -print0 \
            | xargs -0 -n1 vtool -show-build 2>/dev/null | awk '/minos|version/ {print $2}' | sort -V | uniq -c || true
          mkdir -p dmg
          ditto "$APP" "dmg/5K Video Downloader.app"
          ln -s /Applications dmg/Aplicativos
          for tentativa in 1 2 3 4 5; do   # o hdiutil às vezes falha com "Resource busy" nos runners
            hdiutil create -volname "5K Video Downloader" -srcfolder dmg -fs HFS+ -format UDZO -ov "$DMG" && break
            sleep 10
          done
          ls -l "$DMG"

      - name: Testar (abre o programa de dentro do .dmg)
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/5k "$DMG"
          NO_DMG="/tmp/5k/5K Video Downloader.app"
          "$(find "$NO_DMG" -type f -name deno | head -1)" --version
          "$(find "$NO_DMG" -type f -name 'ffmpeg-*' | head -1)" -hide_banner -version | head -1
          head -8 "$(find "$NO_DMG" -path '*licencas/LEIA-ME.txt' | head -1)"
          "$NO_DMG/Contents/MacOS/5K Video Downloader" &
          PID=$!
          sleep 30
          LOG="$HOME/Library/Application Support/5K Video Downloader/registro.log"
          cat "$LOG" || true
          kill -0 $PID || { echo "::error::O programa fechou sozinho"; exit 1; }
          grep -q 'aberto .*JavaScript: deno' "$LOG" || { echo "::error::O programa não abriu direito"; exit 1; }
          if grep -qE 'Traceback|erro interno' "$LOG"; then echo "::error::Erro no registro"; exit 1; fi
          kill $PID
          sleep 2
          hdiutil detach /tmp/5k -force

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.arquivo }}
          path: ${{ env.DMG }}
          if-no-files-found: error
          retention-days: 2

  linux:
    needs: conferir
    runs-on: ubuntu-22.04              # o mais antigo: o .deb roda do Ubuntu 22.04 / Mint 21 / Debian 12 em diante
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CODIGO }}
          ref: ${{ inputs.versao }}
          token: ${{ secrets.CODIGO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Bibliotecas para compilar o PyGObject
        run: sudo apt-get update -q && sudo apt-get install -y -q libgirepository1.0-dev libcairo2-dev pkg-config

      - name: Compilar (PyInstaller; GTK, WebKitGTK e ffmpeg ficam no sistema)
        run: python empacotar.py

      - name: Instalador .deb
        env:
          VERSAO: ${{ inputs.versao }}
        run: |
          du -sh "dist/5K Video Downloader"
          bash instalador/empacotar-deb.sh "$VERSAO"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 5K-Video-Downloader-Linux.deb
          path: dist/5K-Video-Downloader-Linux.deb
          if-no-files-found: error
          retention-days: 2

  linux-teste:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: 5K-Video-Downloader-Linux.deb

      - name: Testar (instala o .deb e abre o programa)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb x11-utils imagemagick desktop-file-utils \
            ./5K-Video-Downloader-Linux.deb
          desktop-file-validate /usr/share/applications/5k-video-downloader.desktop
          du -sh /opt/5k-video-downloader
          cat > teste.sh <<'FIM'
          5k-video-downloader > programa.log 2>&1 &
          PID=$!
          sleep 40
          xwininfo -root -tree | grep -i "5K Video Downloader" || echo "(janela não encontrada na lista)"
          import -window root tela.png || true
          kill -0 $PID || { echo "O programa fechou sozinho"; cat programa.log; exit 1; }
          kill $PID
          FIM
          xvfb-run -a -s '-screen 0 1280x800x24' bash teste.sh
          LOG="$HOME/.local/share/5K Video Downloader/registro.log"
          cat programa.log "$LOG" || true
          grep -q 'aberto .*JavaScript: deno' "$LOG" || { echo "::error::O programa não abriu direito"; exit 1; }
          if grep -qE 'Traceback|erro interno' "$LOG"; then echo "::error::Erro no registro"; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tela-${{ matrix.runner }}
          path: tela.png
          if-no-files-found: ignore
          retention-days: 2

  android:
    needs: conferir
    runs-on: ubuntu-latest
    env:
      # Impressão digital (SHA-256) do certificado da chave fixa do app: o APK publicado tem de ser assinado por ela
      CERTIFICADO_ANDROID: '2C:DF:6D:1D:1A:59:DF:7D:26:9F:76:2A:B2:5A:44:D6:04:95:5E:D1:4E:44:E5:13:AF:D1:71:A7:5F:73:0F:35'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CODIGO }}
          ref: ${{ inputs.versao }}
          token: ${{ secrets.CODIGO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (o Chaquopy usa para instalar os pacotes do app)
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.14.6'

      - name: Chave fixa de assinatura
        env:
          CHAVE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$CHAVE" ]; then
            echo "::error::Falta o secret ANDROID_KEYSTORE (a chave fixa do app Android)."
            exit 1
          fi
          printf '%s' "$CHAVE" | base64 -d > "$RUNNER_TEMP/android-5k.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/android-5k.p12" >> "$GITHUB_ENV"

      - name: APK (arm64, assinado com a chave fixa)
        env:
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          gradle -p android assembleArm64Release --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/arm64/release/app-arm64-release.apk dist/5K-Video-Downloader-Android.apk
          ASSINADOR=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$ASSINADOR" verify --print-certs dist/5K-Video-Downloader-Android.apk | tee certificado.txt
          ASSINATURA=$(grep -m1 "SHA-256 digest" certificado.txt | awk '{print $NF}' | tr a-f A-F | sed 's/../&:/g; s/:$//')
          if [ "$ASSINATURA" != "$CERTIFICADO_ANDROID" ]; then
            echo "::error::O APK não foi assinado pela chave fixa do app ($ASSINATURA)."
            exit 1
          fi
          ls -l dist/5K-Video-Downloader-Android.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 5K-Video-Downloader-Android.apk
          path: dist/5K-Video-Downloader-Android.apk
          if-no-files-found: error
          retention-days: 2

  publicar:
    if: inputs.publicar
    needs: [windows, macos, linux, linux-teste, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pacotes
          pattern: 5K-Video-Downloader-*
          merge-multiple: true

      - name: Publicar a Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.versao }}
        run: |
          if [[ "$TAG" != v* ]]; then
            echo "::error::Só tags v* viram Release (recebi \"$TAG\"). Para testar sem publicar, use publicar=false."
            exit 1
          fi
          ls -l pacotes
          cat > notas.md <<'FIM'
          Baixe o arquivo do seu computador:

          - **Windows 10 ou 11 (64 bits)**: `5K-Video-Downloader-Windows.exe`
          - **Mac com chip Apple (M1 em diante)**: `5K-Video-Downloader-macOS.dmg`
          - **Mac com processador Intel**: `5K-Video-Downloader-macOS-Intel.dmg`
          - **Linux (Ubuntu 22.04+, Linux Mint 21+, Debian 12+)**: `5K-Video-Downloader-Linux.deb`
          - **Android 7 ou mais novo (celulares de 64 bits)**: `5K-Video-Downloader-Android.apk`

          O programa ainda não tem assinatura digital, por isso o sistema avisa na primeira vez:

          - **Windows**: na tela "O Windows protegeu o computador", clique em **Mais informações** e depois em **Executar assim mesmo**.
          - **Linux**: abra o .deb com dois cliques (Instalador de pacotes) ou rode `sudo apt install ./5K-Video-Downloader-Linux.deb`. O programa aparece no menu de aplicativos.
          - **Android**: abra o arquivo baixado; o celular pede para **permitir instalar apps desta fonte** (do navegador ou do app de arquivos). Se o Play Protect avisar, toque em **Mais detalhes → Instalar mesmo assim**.
          - **macOS**: arraste o 5K Video Downloader para Aplicativos e abra. Se o Mac disser que não pode abrir, vá em **Ajustes do Sistema → Privacidade e Segurança** e clique em **Abrir Mesmo Assim** (no macOS 14 ou anterior: botão direito no app → **Abrir**).

          Os arquivos `manifesto.json` e `manifesto.json.sig` são a assinatura dos instaladores: o programa confere sozinho antes de se atualizar. Não precisa baixá-los.
          FIM
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Instaladores novos: o manifesto assinado antigo deixa de valer até o ./lancar-versao.sh assinar de novo
            for f in manifesto.json manifesto.json.sig; do
              gh release delete-asset "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            done
            gh release upload "$TAG" pacotes/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" pacotes/* --repo "$GITHUB_REPOSITORY" --target main --latest \
              --title "5K Video Downloader ${TAG#v}" --notes-file notas.md
          fi
          echo "Links:"
          for f in pacotes/*; do echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$(basename "$f")"; done
